# 아래 세 키는 `yarn set version stable`(4.3 → 4.18) 이 이전 동작을 유지하려고 명시적으로 써 넣은 값이다.
# - approvedGitRepositories: 4.1x 부터 git 의존성 설치에 승인이 필요해짐. 기존처럼 전부 허용
# - enableScripts: 4.1x 기본값 변경 대비. 기존처럼 postinstall 등 라이프사이클 스크립트 허용(husky install 등)
# - npmMinimalAgeGate: 4.1x 의 "갓 배포된 패키지 보류" 기능을 기존처럼 끔(0)
approvedGitRepositories:
  - "**"

compressionLevel: mixed

defaultSemverRangePrefix: ""

enableGlobalCache: false

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# TODO: Gatsby 5 마이그레이션 후 제거 가능한지 확인
packageExtensions:
  gatsby-plugin-image@2.13.0:
    peerDependencies:
      "@emotion/react": 11.10.0
