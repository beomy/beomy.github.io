<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', Roboto, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>

  <!-- ===== 왼쪽: import ===== -->
  <rect x="20" y="20" width="450" height="380" rx="14" fill="#fdf4f4" stroke="#f1c4c4"/>
  <text x="40" y="48" font-size="15" font-weight="700" fill="#b23b3b">✕ import 로 넣기</text>
  <text x="40" y="68" fill="#6b7280" font-size="12">클라이언트 컴포넌트 파일에서 서버 컴포넌트를 import</text>

  <!-- ClientComponent 상자 -->
  <rect x="60" y="90" width="370" height="200" rx="10" fill="#ffffff" stroke="#3da35d" stroke-width="1.5"/>
  <text x="76" y="114" font-weight="700" fill="#1f2937">ClientComponent</text>
  <text x="76" y="132" fill="#4b5563" font-size="12">'use client' · 클라이언트 번들</text>
  <text x="76" y="162" font-family="Menlo, Consolas, monospace" font-size="12" fill="#4b5563">import ServerComponent from './Server'</text>

  <!-- 끌려 들어온 ServerComponent -->
  <rect x="90" y="186" width="310" height="80" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="106" y="210" font-weight="700" fill="#1f2937">ServerComponent</text>
  <text x="106" y="228" fill="#4b5563" font-size="12">코드째로 클라이언트 번들에 끌려 들어옴</text>
  <text x="106" y="246" fill="#4b5563" font-size="12">→ 그냥 클라이언트 컴포넌트가 되어 버림</text>
  <line x1="245" y1="168" x2="245" y2="184" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 결과 -->
  <text x="60" y="320" fill="#1f2937" font-weight="700" font-size="12">결과</text>
  <text x="60" y="340" fill="#4b5563" font-size="12">• 에러는 없지만 서버 컴포넌트의 의미가 사라짐</text>
  <text x="60" y="358" fill="#4b5563" font-size="12">• async 였거나 DB 모듈을 썼다면 에러</text>
  <text x="60" y="376" fill="#4b5563" font-size="12">• 서버 전용 코드가 브라우저로 노출될 수 있음</text>

  <!-- ===== 오른쪽: children ===== -->
  <rect x="490" y="20" width="450" height="380" rx="14" fill="#f2faf5" stroke="#bfe3cc"/>
  <text x="510" y="48" font-size="15" font-weight="700" fill="#2e7d4f">○ children 으로 넣기</text>
  <text x="510" y="68" fill="#6b7280" font-size="12">서버 컴포넌트 Page 가 둘을 JSX 로 중첩해 반환</text>

  <!-- Page (서버) 바깥 상자: JSX 중첩 그대로 -->
  <rect x="510" y="84" width="410" height="262" rx="10" fill="#e8effb" stroke="#4a7bd0" stroke-width="1.5"/>
  <text x="526" y="106" font-weight="700" fill="#1f2937">Page</text>
  <text x="570" y="106" fill="#4b5563" font-size="12">서버 컴포넌트</text>
  <text x="526" y="126" font-family="Menlo, Consolas, monospace" font-size="11" fill="#4b5563">&lt;ClientComponent&gt;&lt;ServerComponent /&gt;&lt;/ClientComponent&gt;</text>

  <!-- ClientComponent 상자 -->
  <rect x="526" y="140" width="378" height="190" rx="10" fill="#ffffff" stroke="#3da35d" stroke-width="1.5"/>
  <text x="542" y="162" font-weight="700" fill="#1f2937">ClientComponent</text>
  <text x="542" y="180" fill="#4b5563" font-size="12">'use client' · RSC Payload 에는 참조만 기록</text>
  <text x="542" y="196" fill="#4b5563" font-size="12">children 이 무엇인지 모른 채 자리만 내어 줌</text>

  <!-- slot -->
  <rect x="542" y="208" width="346" height="106" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="558" y="228" fill="#9ca3af" font-size="12">{children}  빈 자리(Slot)</text>

  <!-- ServerComponent inside slot -->
  <rect x="558" y="240" width="314" height="62" rx="8" fill="#e8effb" stroke="#4a7bd0" stroke-width="1.5"/>
  <text x="574" y="260" font-weight="700" fill="#1f2937">ServerComponent</text>
  <text x="574" y="277" fill="#4b5563" font-size="11">서버에서 실행됨 · 코드는 서버에만 남음</text>
  <text x="574" y="292" fill="#4b5563" font-size="11">렌더링 결과(엘리먼트)만 RSC Payload 에 담겨 이 자리에 들어감</text>

  <text x="510" y="372" fill="#4b5563" font-size="12">결과: 서버 컴포넌트는 서버에 남고, 클라이언트 컴포넌트는 자리만 내어 줌</text>
  <text x="510" y="390" fill="#4b5563" font-size="12">클라이언트 번들에는 ClientComponent 만 들어감</text>
</svg>
