<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', Roboto, sans-serif" font-size="13" xml:space="preserve">
  <rect width="760" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- git repo (outside cluster, left) -->
  <rect x="10" y="184" width="170" height="80" rx="10" fill="#fff4e0" stroke="#d97706" stroke-width="1.5"/>
  <text x="95" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">매니페스트 저장소</text>
  <text x="20" y="233" font-family="Menlo, Consolas, monospace" font-size="11" fill="#1f2937">├─ apps/web/</text>
  <text x="20" y="251" font-family="Menlo, Consolas, monospace" font-size="11" fill="#1f2937">└─ argocd/web-prod.yaml</text>

  <!-- EKS cluster -->
  <rect x="210" y="20" width="530" height="480" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="228" y="46" font-size="14" font-weight="700" fill="#475569">EKS 클러스터</text>
  <text x="720" y="46" text-anchor="end" font-size="12" fill="#64748b">Argo CD 도 web 서버도 각자의 Deployment 가 Pod 를 유지한다</text>

  <!-- control plane -->
  <rect x="230" y="60" width="490" height="62" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="248" y="86" font-size="14" font-weight="700" fill="#334155">컨트롤 플레인</text>
  <text x="248" y="106" font-size="12" fill="#4b5563">AWS 가 관리. Deployment 컨트롤러가 Pod 수를 유지</text>
  <rect x="560" y="72" width="140" height="38" rx="19" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="630" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">API 서버</text>

  <!-- namespace: argocd -->
  <rect x="230" y="150" width="230" height="320" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="246" y="176" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#4f46e5">argocd</text>
  <text x="444" y="176" text-anchor="end" font-size="11" fill="#4f46e5">네임스페이스</text>

  <rect x="246" y="196" width="198" height="70" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="256" y="214" font-size="12" font-weight="700" fill="#1f2937">StatefulSet</text>
  <text x="256" y="229" font-size="11" font-weight="700" fill="#1f2937">application-controller</text>
  <rect x="256" y="237" width="44" height="22" rx="5" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="278" y="252" text-anchor="middle" font-size="11" fill="#312e81">Pod</text>
  <text x="310" y="252" font-size="11" fill="#4b5563">git 을 읽어 YAML 적용</text>

  <rect x="246" y="278" width="198" height="56" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="256" y="296" font-size="12" font-weight="700" fill="#1f2937">Deployment argocd-server</text>
  <rect x="256" y="306" width="44" height="22" rx="5" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="278" y="321" text-anchor="middle" font-size="11" fill="#312e81">Pod</text>
  <text x="310" y="321" font-size="11" fill="#4b5563">UI 와 API</text>

  <rect x="246" y="346" width="198" height="70" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="256" y="364" font-size="12" font-weight="700" fill="#1f2937">Deployment</text>
  <text x="256" y="379" font-size="11" font-weight="700" fill="#1f2937">argocd-repo-server</text>
  <rect x="256" y="387" width="44" height="22" rx="5" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="278" y="402" text-anchor="middle" font-size="11" fill="#312e81">Pod</text>
  <text x="310" y="402" font-size="11" fill="#4b5563">git clone, helm template</text>

  <text x="246" y="438" font-size="11" fill="#4b5563">argo-cd chart 로 설치</text>
  <text x="246" y="456" font-size="11" fill="#4b5563">(Argo 프로젝트가 제공)</text>

  <!-- namespace: web -->
  <rect x="490" y="150" width="230" height="320" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="506" y="176" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1d4ed8">web</text>
  <text x="704" y="176" text-anchor="end" font-size="11" fill="#1d4ed8">네임스페이스</text>

  <rect x="506" y="196" width="198" height="86" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="516" y="214" font-size="12" font-weight="700" fill="#1f2937">Deployment web</text>
  <text x="516" y="229" font-size="11" fill="#4b5563">배포하는 서버 (Next.js)</text>
  <rect x="516" y="240" width="44" height="22" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="538" y="255" text-anchor="middle" font-size="11" fill="#1e3a8a">Pod</text>
  <rect x="566" y="240" width="44" height="22" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="588" y="255" text-anchor="middle" font-size="11" fill="#1e3a8a">Pod</text>
  <rect x="616" y="240" width="44" height="22" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="638" y="255" text-anchor="middle" font-size="11" fill="#1e3a8a">Pod</text>

  <rect x="506" y="294" width="198" height="40" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="516" y="318" font-size="12" font-weight="700" fill="#1f2937">Service web</text>

  <rect x="506" y="346" width="198" height="40" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="516" y="370" font-size="12" font-weight="700" fill="#1f2937">Ingress web</text>

  <text x="506" y="438" font-size="11" fill="#4b5563">직접 만든 web chart 를</text>
  <text x="506" y="456" font-size="11" fill="#4b5563">Argo CD 가 설치</text>

  <!-- arrow: git -> Argo CD -->
  <line x1="180" y1="224" x2="244" y2="224" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="214" text-anchor="middle" font-size="11" fill="#6b7280">git 읽기</text>

  <!-- arrow: Argo CD -> API server -->
  <line x1="350" y1="196" x2="350" y2="124" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="358" y="141" font-size="11" fill="#6b7280">렌더링한 YAML 적용</text>
</svg>
