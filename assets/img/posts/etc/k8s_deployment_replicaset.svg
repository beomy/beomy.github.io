  <path d="M555,102 L555,158" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M640,102 L640,124 L865,124 L865,158" fill="none" stroke="#2f4f8f" stroke-width="1.6" marker-end="url(#arrow-blue)"/>

