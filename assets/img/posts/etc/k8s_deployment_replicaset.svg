  <text x="436" y="184" font-size="13" font-weight="700" fill="#6b7280">ReplicaSet web-6f7b8c9d5</text>
  <text x="436" y="204" font-size="11" fill="#6b7280">template: web:1.2.2</text>
  <text x="436" y="222" font-size="11" fill="#6b7280">replicas: 0 · 1일 전 버전</text>
