  <rect x="110" y="160" width="270" height="90" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="126" y="184" font-size="13" font-weight="700" fill="#6b7280">ReplicaSet web-5c8d7f9b4</text>
  <text x="126" y="204" font-size="11" fill="#6b7280">template: web:1.2.1</text>
  <text x="126" y="222" font-size="11" fill="#6b7280">replicas: 0 · 3일 전 버전</text>
