<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', Roboto, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="40" y="36" font-size="15" font-weight="700" fill="#2f4f8f">컴파일된 코드</text>
  <text x="560" y="36" font-size="15" font-weight="700" fill="#2f4f8f">캐시 배열 $ (컴포넌트 인스턴스마다 하나)</text>

  <rect x="40" y="52" width="480" height="104" rx="8" fill="#dbe7fb" stroke="#4a7bd0" stroke-width="1.5"/>
  <text x="52" y="72" font-size="12" fill="#2f4f8f" font-weight="700">Reactive Scope A · 입력: items</text>
  <text x="52" y="94" font-family="Menlo, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">if ($[0] !== items) {</text>
  <text x="52" y="112" font-family="Menlo, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">  t1 = sum(items); $[0] = items; $[1] = t1;</text>
  <text x="52" y="130" font-family="Menlo, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">} else { t1 = $[1]; }</text>
  <text x="52" y="148" font-family="Menlo, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">const total = t1;</text>

  <rect x="40" y="172" width="480" height="104" rx="8" fill="#d8f0e0" stroke="#3da35d" stroke-width="1.5"/>
  <text x="52" y="192" font-size="12" fill="#2a7a44" font-weight="700">Reactive Scope B · 입력: count</text>
  <text x="52" y="214" font-family="Menlo, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">if ($[2] !== count) {</text>
  <text x="52" y="232" font-family="Menlo, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">  t2 = () =&gt; setCount(count + 1); $[2] = count; $[3] = t2;</text>
  <text x="52" y="250" font-family="Menlo, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">} else { t2 = $[3]; }</text>
  <text x="52" y="268" font-family="Menlo, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">const onClick = t2;</text>

  <rect x="40" y="292" width="480" height="86" rx="8" fill="#fde9b4" stroke="#d9a520" stroke-width="1.5"/>
  <text x="52" y="312" font-size="12" fill="#9a6b00" font-weight="700">Reactive Scope C · 입력 없음 (최초 1회만 생성)</text>
  <text x="52" y="334" font-family="Menlo, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">if ($[9] === Symbol.for("react.memo_cache_sentinel")) {</text>
  <text x="52" y="352" font-family="Menlo, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">  t5 = &lt;Child /&gt;; $[9] = t5;</text>
  <text x="52" y="370" font-family="Menlo, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">} else { t5 = $[9]; }</text>

  <g font-size="12">
    <rect x="560" y="60" width="60" height="30" rx="4" fill="#dbe7fb" stroke="#4a7bd0"/><text x="570" y="80" fill="#1f2937">$[0]</text>
    <text x="630" y="80" fill="#4b5563">items 의 이전 값 (의존성)</text>
    <rect x="560" y="96" width="60" height="30" rx="4" fill="#dbe7fb" stroke="#4a7bd0"/><text x="570" y="116" fill="#1f2937">$[1]</text>
    <text x="630" y="116" fill="#4b5563">sum(items) 의 결과 (출력)</text>
    <rect x="560" y="132" width="60" height="30" rx="4" fill="#d8f0e0" stroke="#3da35d"/><text x="570" y="152" fill="#1f2937">$[2]</text>
    <text x="630" y="152" fill="#4b5563">count 의 이전 값 (의존성)</text>
    <rect x="560" y="168" width="60" height="30" rx="4" fill="#d8f0e0" stroke="#3da35d"/><text x="570" y="188" fill="#1f2937">$[3]</text>
    <text x="630" y="188" fill="#4b5563">onClick 함수 (출력)</text>
    <rect x="560" y="204" width="60" height="30" rx="4" fill="#f3f4f6" stroke="#9ca3af"/><text x="570" y="224" fill="#1f2937">…</text>
    <text x="630" y="224" fill="#4b5563">&lt;p&gt;, &lt;button&gt; 엘리먼트와 그 의존성</text>
    <rect x="560" y="240" width="60" height="30" rx="4" fill="#fde9b4" stroke="#d9a520"/><text x="570" y="260" fill="#1f2937">$[9]</text>
    <text x="630" y="260" fill="#4b5563">&lt;Child /&gt; 엘리먼트 (출력, 의존성 없음)</text>
  </g>

  <path d="M520,104 L556,86" fill="none" stroke="#4a7bd0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M520,224 L556,170" fill="none" stroke="#3da35d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M520,335 L556,262" fill="none" stroke="#d9a520" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="560" y="310" fill="#1f2937" font-size="13" font-weight="700">읽는 법</text>
  <text x="560" y="332" fill="#4b5563" font-size="12">· 처음 렌더링: 모든 칸이 sentinel 이라 전부 계산해서 채웁니다.</text>
  <text x="560" y="352" fill="#4b5563" font-size="12">· count 만 바뀐 리렌더링: B 만 다시 계산, A 와 C 는 칸의 값을 꺼냅니다.</text>
  <text x="560" y="372" fill="#4b5563" font-size="12">· 비교는 ===, useMemo 의 의존성 배열 비교와 같습니다.</text>
</svg>
