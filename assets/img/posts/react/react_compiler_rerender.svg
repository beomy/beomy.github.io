<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', Roboto, sans-serif" font-size="14">
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="40" y="36" font-size="15" font-weight="700" fill="#2f4f8f">컴파일 전 · count 가 바뀌면</text>
  <text x="520" y="36" font-size="15" font-weight="700" fill="#2f4f8f">컴파일 후 · count 가 바뀌면</text>
  <line x1="490" y1="20" x2="490" y2="320" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- left -->
  <rect x="150" y="60" width="200" height="48" rx="8" fill="#fde0d0" stroke="#e0603a" stroke-width="1.5"/>
  <text x="162" y="80" font-weight="700" fill="#1f2937">FriendList</text>
  <text x="162" y="98" fill="#4b5563" font-size="12">count 상태 변경 → 리렌더링</text>
  <path d="M200,108 L110,150" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M250,108 L250,150" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M300,108 L395,150" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="40" y="150" width="135" height="48" rx="8" fill="#fde0d0" stroke="#e0603a" stroke-width="1.5"/>
  <text x="52" y="170" font-weight="700" fill="#1f2937">&lt;p&gt;</text>
  <text x="52" y="188" fill="#4b5563" font-size="12">엘리먼트 새로 생성</text>
  <rect x="185" y="150" width="135" height="48" rx="8" fill="#fde0d0" stroke="#e0603a" stroke-width="1.5"/>
  <text x="197" y="170" font-weight="700" fill="#1f2937">&lt;button&gt;</text>
  <text x="197" y="188" fill="#4b5563" font-size="12">onClick 도 새 함수</text>
  <rect x="330" y="150" width="135" height="48" rx="8" fill="#fde0d0" stroke="#e0603a" stroke-width="1.5"/>
  <text x="342" y="170" font-weight="700" fill="#1f2937">&lt;Child /&gt;</text>
  <text x="342" y="188" fill="#4b5563" font-size="12">새 엘리먼트 → 실행</text>
  <text x="40" y="236" fill="#4b5563" font-size="12">· sum(items) 도 다시 계산합니다.</text>
  <text x="40" y="256" fill="#4b5563" font-size="12">· Child 는 props 가 없는데도 부모가 만든</text>
  <text x="40" y="274" fill="#4b5563" font-size="12">  엘리먼트 객체가 새것이라 React 가 다시 실행합니다.</text>
  <text x="40" y="292" fill="#4b5563" font-size="12">  memo() 로 감싸야만 건너뜁니다.</text>

  <!-- right -->
  <rect x="630" y="60" width="200" height="48" rx="8" fill="#fde0d0" stroke="#e0603a" stroke-width="1.5"/>
  <text x="642" y="80" font-weight="700" fill="#1f2937">FriendList</text>
  <text x="642" y="98" fill="#4b5563" font-size="12">count 상태 변경 → 리렌더링</text>
  <path d="M680,108 L590,150" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M730,108 L730,150" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M780,108 L875,150" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="520" y="150" width="135" height="48" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="532" y="170" font-weight="700" fill="#1f2937">&lt;p&gt;</text>
  <text x="532" y="188" fill="#4b5563" font-size="12">$ 에서 꺼냄</text>
  <rect x="665" y="150" width="135" height="48" rx="8" fill="#fde0d0" stroke="#e0603a" stroke-width="1.5"/>
  <text x="677" y="170" font-weight="700" fill="#1f2937">&lt;button&gt;</text>
  <text x="677" y="188" fill="#4b5563" font-size="12">count 의존 → 새로 생성</text>
  <rect x="810" y="150" width="135" height="48" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="822" y="170" font-weight="700" fill="#1f2937">&lt;Child /&gt;</text>
  <text x="822" y="188" fill="#4b5563" font-size="12">같은 엘리먼트 → 건너뜀</text>
  <text x="520" y="236" fill="#4b5563" font-size="12">· sum(items) 은 items 가 그대로라 캐시에서 꺼냅니다.</text>
  <text x="520" y="256" fill="#4b5563" font-size="12">· Child 엘리먼트 객체가 이전과 같은 참조라</text>
  <text x="520" y="274" fill="#4b5563" font-size="12">  React 가 리렌더링을 건너뜁니다.</text>
  <text x="520" y="292" fill="#4b5563" font-size="12">  memo() 없이 memo() 와 같은 효과입니다.</text>

  <rect x="40" y="330" width="12" height="12" rx="3" fill="#fde0d0" stroke="#e0603a"/><text x="58" y="340" fill="#4b5563" font-size="12">다시 계산·실행됨</text>
  <rect x="180" y="330" width="12" height="12" rx="3" fill="#f3f4f6" stroke="#9ca3af"/><text x="198" y="340" fill="#4b5563" font-size="12">이전 결과 재사용</text>
</svg>
