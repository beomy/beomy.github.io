<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', Roboto, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- 서버 영역 -->
  <rect x="20" y="20" width="560" height="430" rx="14" fill="#f3f6fb" stroke="#c7d2e6"/>
  <text x="40" y="48" font-size="16" font-weight="700" fill="#2f4f8f">서버</text>

  <!-- 1. 서버 컴포넌트 실행 -->
  <rect x="40" y="70" width="230" height="78" rx="10" fill="#ffffff" stroke="#4a7bd0" stroke-width="1.5"/>
  <text x="56" y="96" font-weight="700" fill="#1f2937">1. 서버 컴포넌트 실행</text>
  <text x="56" y="118" fill="#4b5563">DB 조회 등 데이터 접근</text>
  <text x="56" y="136" fill="#4b5563">클라이언트 컴포넌트는 참조만 남김</text>

  <!-- 화살표 1 → RSC Payload -->
  <line x1="270" y1="109" x2="330" y2="109" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RSC Payload -->
  <rect x="332" y="70" width="228" height="78" rx="10" fill="#fff7e0" stroke="#d9a520" stroke-width="1.5"/>
  <text x="348" y="96" font-weight="700" fill="#1f2937">RSC Payload</text>
  <text x="348" y="118" font-family="Menlo, Consolas, monospace" font-size="12" fill="#4b5563">0:["$","article",...]</text>
  <text x="348" y="136" font-family="Menlo, Consolas, monospace" font-size="12" fill="#4b5563">1:I["./Counter.js",...]</text>

  <!-- 화살표 RSC Payload ↓ SSR -->
  <line x1="446" y1="148" x2="446" y2="196" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 클라이언트 컴포넌트 코드 → SSR -->
  <rect x="40" y="200" width="230" height="56" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="56" y="224" fill="#374151">클라이언트 컴포넌트 코드</text>
  <text x="56" y="244" fill="#6b7280" font-size="12">Counter.js (서버에서도 한 번 실행)</text>
  <line x1="270" y1="228" x2="330" y2="228" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. SSR -->
  <rect x="332" y="200" width="228" height="96" rx="10" fill="#ffffff" stroke="#4a7bd0" stroke-width="1.5"/>
  <text x="348" y="226" font-weight="700" fill="#1f2937">2. SSR</text>
  <text x="348" y="248" fill="#4b5563">RSC Payload 와</text>
  <text x="348" y="266" fill="#4b5563">클라이언트 컴포넌트로</text>
  <text x="348" y="284" fill="#4b5563">HTML 생성</text>

  <!-- 화살표 SSR ↓ 응답 -->
  <line x1="446" y1="296" x2="446" y2="326" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. 응답 -->
  <rect x="40" y="330" width="520" height="96" rx="10" fill="#ffffff" stroke="#4a7bd0" stroke-width="1.5"/>
  <text x="56" y="356" font-weight="700" fill="#1f2937">3. 응답 하나에 둘 다 담아 전송</text>
  <rect x="56" y="370" width="236" height="40" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="68" y="388" fill="#1f2937" font-weight="700" font-size="13">HTML</text>
  <text x="68" y="404" fill="#4b5563" font-size="12">JS 실행 전에 화면을 바로 그리기 위해</text>
  <rect x="308" y="370" width="236" height="40" rx="8" fill="#fff7e0" stroke="#d9a520"/>
  <text x="320" y="388" fill="#1f2937" font-weight="700" font-size="13">RSC Payload (&lt;script&gt;에 포함)</text>
  <text x="320" y="404" fill="#4b5563" font-size="12">트리 복원과 하이드레이션을 위해</text>

  <!-- 서버 → 브라우저 큰 화살표 -->
  <line x1="560" y1="378" x2="624" y2="378" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 브라우저 영역 -->
  <rect x="620" y="20" width="320" height="430" rx="14" fill="#f2faf5" stroke="#bfe3cc"/>
  <text x="640" y="48" font-size="16" font-weight="700" fill="#2e7d4f">브라우저</text>

  <!-- 4-1 HTML 표시 -->
  <rect x="640" y="330" width="280" height="96" rx="10" fill="#ffffff" stroke="#3da35d" stroke-width="1.5"/>
  <text x="656" y="356" font-weight="700" fill="#1f2937">4. HTML 을 먼저 화면에 표시</text>
  <text x="656" y="378" fill="#4b5563">아직 JavaScript 는 실행 전</text>
  <text x="656" y="396" fill="#4b5563">보이지만 클릭에는 반응하지 않음</text>

  <!-- 화살표 위로 -->
  <line x1="780" y1="330" x2="780" y2="282" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4-2 트리 복원 -->
  <rect x="640" y="200" width="280" height="78" rx="10" fill="#ffffff" stroke="#3da35d" stroke-width="1.5"/>
  <text x="656" y="226" font-weight="700" fill="#1f2937">RSC Payload 로 트리 복원</text>
  <text x="656" y="248" fill="#4b5563">$L1 → Counter.js 청크 다운로드</text>
  <text x="656" y="266" fill="#4b5563">서버 컴포넌트 부분은 결과만 그대로 사용</text>

  <!-- 화살표 위로 -->
  <line x1="780" y1="200" x2="780" y2="152" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4-3 하이드레이션 -->
  <rect x="640" y="70" width="280" height="78" rx="10" fill="#ffffff" stroke="#3da35d" stroke-width="1.5"/>
  <text x="656" y="96" font-weight="700" fill="#1f2937">클라이언트 컴포넌트만 하이드레이션</text>
  <text x="656" y="118" fill="#4b5563">복원한 트리를 HTML 에 연결</text>
  <text x="656" y="136" fill="#4b5563">이제 클릭 등 상호작용 가능</text>
</svg>
