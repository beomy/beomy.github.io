  <text x="470" y="300" fill="#1f2937" font-size="13" font-weight="700">읽는 법</text>
  <rect x="470" y="312" width="12" height="12" rx="3" fill="#dbe7fb"/><text x="488" y="322" fill="#4b5563" font-size="12">일반 HTML 엘리먼트는 태그 이름을 그대로 기록</text>
  <rect x="470" y="332" width="12" height="12" rx="3" fill="#d8f0e0"/><text x="488" y="342" fill="#4b5563" font-size="12">서버에서 읽은 데이터는 값만 남고, 읽는 코드는 남지 않음</text>
  <rect x="470" y="352" width="12" height="12" rx="3" fill="#fde9b4"/><text x="488" y="362" fill="#4b5563" font-size="12">클라이언트 컴포넌트는 RSC Payload 생성 시 실행하지 않고 참조(1번 항목의 모듈 정보)로 기록</text>
  <rect x="470" y="372" width="12" height="12" rx="3" fill="#e6e3fb"/><text x="488" y="382" fill="#4b5563" font-size="12">클라이언트 컴포넌트에 넘긴 props 는 계산이 끝난 값으로 기록</text>
  <text x="60" y="322" fill="#4b5563" font-size="12">Page 자체는 실행되어 사라지고 반환한 트리만 남습니다.</text>
  <text x="60" y="342" fill="#4b5563" font-size="12">서버 컴포넌트의 이름은 RSC Payload 에 등장하지 않습니다.</text>
</svg>
