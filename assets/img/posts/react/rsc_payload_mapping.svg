  <text x="494" y="140" font-family="Menlo, Consolas, monospace" font-size="12" xml:space="preserve"><tspan fill="#4b5563">["$",</tspan><tspan fill="#1f2937" font-weight="700">"h1"</tspan><tspan fill="#4b5563">,null,{"children":</tspan><tspan fill="#1f2937" font-weight="700">"Hello"</tspan><tspan fill="#4b5563">}],</tspan></text>
  <rect x="529.0" y="155" width="41.0" height="18" rx="4" fill="#fde9b4"/>
