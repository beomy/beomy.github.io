\":\"2023-11-17\",\"timeToRead\":3,\"summary\":\"Suspense는 컴포넌트가 화면에 노출하기 위해 필요한 데이터가 아직 준비되지 않았다고 알려주는 기능으로 React 16.6 버전에서 실험적 기능으로 등장해 18 버전에서 정식 지원을 시작한 기능입니다.\",\"category\":[\"tech\",\"react\"]},{\"title\":\"[React] Concurrent Rendering - 동시성 렌더링\",\"url\":\"/tech/react/concurrent-rendering/\",\"thumbnail\":\"react/react.png\",\"createdDate\":\"2023-10-24\",\"timeToRead\":2,\"summary\":\"React 18에서 추가된 기능 중 가장 중요한 것이 사용자 경험을 향상할 수 있는 동시성 렌더링입니다. 이번 포스트에서는 동시성이 무엇인지 그리고 동시성을 위해 추가된 startTransition 함수와 useTransition, useDeferredValue 훅을 살펴보도록 하겠습니다.\",\"category\":[\"tech\",\"react\"]},{\"title\":\"[React] react-hook-form API 레퍼런스\",\"url\":\"/tech/react/react-hook-form-api-reference/\",\"thumbnail\":\"react/react-hook-form.png\",\"createdDate\":\"2023-10-13\",\"timeToRead\":9,\"summary\":\"사용하고 있는 외부 라이브러리 API를 자세히 알면 그 라이브러리에서 제공하는 다양한 기능들을 인지하고 사용할 수 있기 때문에 라이브러리를 더 멋있게 사용할 수 있습니다. 이번 포스트에서는 React Hook Form을 좀 더 멋있게 사용하기 위해 React Hook Form에서 제공하는 API들을 살펴보도록 하겠습니다.\",\"category\":[\"tech\",\"react\"]},{\"title\":\"[React] react-hook-form으로 폼 관리하기\",\"url\":\"/tech/react/react-hook-form/\",\"thumbnail\":\"react/react-hook-form.png\",\"createdDate\":\"2023-07-31\",\"timeToRead\":6,\"summary\":\"React Hook Form은 사용자 입력을 받고 검증하는 것을 도와 주는 라이브러리로, React에서 폼을 관리하는 가장 유명한 라이브러리 중 하나입니다. React Hook Form을 사용하면 사용자에게 입력을 받고 검증하는데 드는 시간을 줄일 뿐만 아니라 더불어 성능까지 두 마리 토끼를 모두 잡을 수 있습니다.\",\"category\":[\"tech\",\"react\"]},{\"title\":\"[React] react-hook-form, formik, rc-field-form 폼 관리 어떤걸로 해야 할까\",\"url\":\"/tech/react/form-libraries/\",\"thumbnail\":\"react/react.png\",\"createdDate\":\"2023-07-15\",\"timeToRead\":3,\"summary\":\"FrontEnd 개발을 하다보면 사용자 입력을 받고 입력 받은 값을 검증하는데에 많은 시간을 쓰게 되는데, 폼 관리 라이브러리를 사용하게 되면 사용자에게 입력을 받고 검증하는데 드는 시간과 노력을 줄일 수 있습니다.\",\"category\":[\"tech\",\"react\"]},{\"title\":\"[책 리뷰] Start up 블로그 글쓰기 나만의 콘텐츠로 성공하기\",\"url\":\"/review/book/start-up-blog-writing/\",\"thumbnail\":\"review/start-up-blog-writing.png\",\"createdDate\":\"2023-07-02\",\"timeToRead\":4,\"summary\":\"내가 책에서 원했던건 목차를 나누는 팁, 의미를 잘 전달하는 방법 같은 글을 잘 쓰는 디테일한 기술들이었다. 하지만 이 책은 디테일 보다는 큰 밑그림을 그려주는 책이다.\",\"category\":[\"review\",\"book\"]},{\"title\":\"[React] TanStack Query v4 (React Query)\",\"url\":\"/tech/react/tanstack-query-v4/\",\"thumbnail\":\"react/tanstack-query.png\",\"createdDate\":\"2023-06-13\",\"timeToRead\":9,\"summary\":\"TanStack Query는 비동기 작업 처리를 돕는 라이브러리입니다. v3까지는 React Query라는 이름으로 React만 지원했는데, v4 부터 React 이외의 프레임워크(Vue, Svelte, Solid)에서 사용할 수 있도록 업데이트 되며 TanStack Query로 이름이 변경되었습니다.\",\"category\":[\"tech\",\"react\"]},{\"title\":\"[ETC] Monorepo - Yarn Berry\",\"url\":\"/tech/etc/monorepo-yarn-berry/\",\"thumbnail\":\"etc/monorepo.png\",\"createdDate\":\"2023-02-15\",\"timeToRead\":2,\"summary\":\"이번 포스트에서는 Yarn Berry를 사용하여 모노레포를 구성해 보도록 하겠습니다. 이번에 구성할 모노레포는 Emotion와 React, TypeScript를 사용한 서비스 프로젝트와 디자인 시스템 프로젝트입니다.\",\"category\":[\"tech\",\"etc\"]},{\"title\":\"[ETC] Monorepo - 개념\",\"url\":\"/tech/etc/monorepo-concept/\",\"thumbnail\":\"etc/monorepo.png\",\"createdDate\":\"2023-02-14\",\"timeToRead\":2,\"summary\":\"하나의 저장소(Repository)에서 여러개의 프로젝트를 관리하는 방식을 모노레포라고 합니다. 이번 포스트에서는 모노레포가 무엇인지 모노레포가 등장하기까지 어떻게 프로젝트 구성이 발전되어 왔는지 살펴보도록 하겠습니다.\",\"category\":[\"tech\",\"etc\"]},{\"title\":\"[ETC] Yarn Berry\",\"url\":\"/tech/etc/yarn-berry/\",\"thumbnail\":\"etc/yarn_berry.png\",\"createdDate\":\"2023-02-08\",\"timeToRead\":3,\"summary\":\"Yarn은 NPM과 동일한 Node Package Manager입니다. Yarn의 1 버전을 Yarn Classic이라고 하고 Yarn의 2 버전 이상을 Yarn Berry라고 합니다.\",\"category\":[\"tech\",\"etc\"]},{\"title\":\"[ETC] package.json의 scripts\",\"url\":\"/tech/etc/package-json-scripts/\",\"thumbnail\":\"etc/package_json.png\",\"createdDate\":\"2022-12-12\",\"timeToRead\":1,\"summary\":\"package.json 파일의 scripts 필드는 빌드, 실행 등에 사용되는 명령어를 선언하거나 패키지의 install, publish 전/후에 실행되는 스크립트 명령어를 선언할 때 사용됩니다.\",\"category\":[\"tech\",\"etc\"]},{\"title\":\"[ETC] package.json 톺아보기\",\"url\":\"/tech/etc/package-json/\",\"thumbnail\":\"etc/package_json.png\",\"createdDate\":\"2022-10-14\",\"timeToRead\":7,\"summary\":\"package.json에는 프로젝트에 대한 설명, 패키지, 실행 스크립트 등의 정보를 담는 매니페이스(Manifest) 파일입니다. 이번 포스트에서는 package.json에서 설정할 수 있는 필드 값들을 하나씩 살펴보도록 하겠습니다.\",\"category\":[\"tech\",\"etc\"]},{\"title\":\"[ETC] HTTP 캐시\",\"url\":\"/tech/etc/http-caching/\",\"thumbnail\":\"etc/HTTP_logo.png\",\"createdDate\":\"2022-06-09\",\"timeToRead\":8,\"summary\":\"HTTP 캐시는 첫 HTTP 요청 시 HTML, Image, JS, CSS 등의 파일을 다운로드 받아 특정 위치에 복사본을 저장하고 이후 동일한 HTTP 요청 시 다시 다운로드하지 않고 내부에 저장한 파일을 사용하여 더 빠르게 서비스하기 위한 기능입니다.\",\"category\":[\"tech\",\"etc\"]},{\"title\":\"[ETC] HTTP 버전\",\"url\":\"/tech/etc/http-version/\",\"thumbnail\":\"etc/HTTP_logo.png\",\"createdDate\":\"2022-03-21\",\"timeToRead\":12,\"summary\":\"HTTP의 버전은 초기 버전인 HTTP/0.9부터, HTTP/1.0, HTTP/1.1, HTTP/2, 그리고 가장 최근 버전인 HTTP/3까지 5개의 버전이 있습니다. 이번 포스트에서 각 버전 별 특징을 살펴보도록 하겠습니다.\",\"category\":[\"tech\",\"etc\"]},{\"title\":\"[ETC] HTTP 톺아보기\",\"url\":\"/tech/etc/http/\",\"thumbnail\":\"etc/HTTP_logo.png\",\"createdDate\":\"2022-01-23\",\"timeToRead\":8,\"summary\":\"HTTP, HyperText Transfer Protocol은 인터넷에서 하이퍼텍스트(HyperText)를 전송(Transfer)하기 위한 통신 규약(Protocol)입니다.\",\"category\":[\"tech\",\"etc\"]},{\"title\":\"[Browser] Cookie 톺아보기\",\"url\":\"/tech/browser/cookie/\",\"thumbnail\":\"browser/cookie.png\",\"createdDate\":\"2021-10-18\",\"timeToRead\":5,\"summary\":\"쿠키를 통해 사용자 인증이 이루어질 경우 쿠키가 탈취 되었을 때 큰 피해가 발생 할 수 있기 때문에 쿠키를 사용하기 전에 쿠키가 무엇인지 이해하고 주의하며 사용하는 것은 중요합니다.\",\"category\":[\"tech\",\"browser\"]},{\"title\":\"[ETC] XSS와 XSRF\",\"url\":\"/tech/etc/xss-xsrf/\",\"thumbnail\":\"etc/xss_xsrf_banner.png\",\"createdDate\":\"2021-07-28\",\"timeToRead\":4,\"summary\":\"웹 취약성을 노리는 XSS와 XSRF에 대해 살펴보도록 하겠습니다.\",\"category\":[\"tech\",\"etc\"]},{\"title\":\"[Browser] CORS란?\",\"url\":\"/tech/browser/cors/\",\"thumbnail\":\"browser/cors.png\",\"createdDate\":\"2020-12-21\",\"timeToRead\":5,\"summary\":\"교차 출처 리소스 공유(Cross-Origin Resource Sharing, CORS)에 대해 살펴보도록 하겠습니다.\",\"category\":[\"tech\",\"browser\"]},{\"title\":\"
